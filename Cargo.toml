[package]
name = "md-preview"
version = "1.4.2"
edition = "2021"
rust-version = "1.89"
description = "Fast, local-first Markdown preview and quick editor. Rust + system WebView, no Electron."
license = "MIT"
repository = "https://github.com/vorojar/md-preview"

[dependencies]
wry = "0.50"
tao = "0.33"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rfd = "0.15"
notify = "7"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation", "NSString"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "vorojar <noreply@vorojar.dev>"
copyright = "vorojar/md-preview contributors"
extended-description = """\
MD Preview is a fast, local-first Markdown previewer and quick editor built with \
Rust and the system WebView. No Electron, no bundled Chromium. Offline syntax \
highlighting, KaTeX math, and Mermaid diagrams."""
section = "utils"
priority = "optional"
depends = "libwebkit2gtk-4.1-0, libgtk-3-0t64 | libgtk-3-0, libayatana-appindicator3-1"
assets = [
    ["target/release/md-preview", "usr/bin/", "755"],
    ["assets/linux/md-preview.desktop", "usr/share/applications/", "644"],
    ["assets/icon_1024.png", "usr/share/icons/hicolor/512x512/apps/md-preview.png", "644"],
]
