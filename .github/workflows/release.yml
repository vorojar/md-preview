name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebView2
        shell: pwsh
        run: |
          # WebView2 is pre-installed on Windows 10/11
          # Just need to build
          echo "WebView2 should be available on the runner"

      - name: Build
        run: cargo build --release

      - name: Verify real WebView2 startup and session recovery
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/verify-windows-startup.ps1

      - name: Package
        shell: bash
        run: |
          cp target/release/md-preview.exe MD-Preview-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MD-Preview-windows-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package (tar.gz)
        run: |
          mkdir -p dist
          cp target/release/md-preview dist/
          tar czf MD-Preview-linux-x64.tar.gz -C dist .

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb and AppImage
        run: ./scripts/build-linux-packages.sh

      - name: Rename Linux packages for release
        run: |
          cp target/debian/*.deb MD-Preview-linux-x64.deb
          cp target/appimage/MD-Preview-x86_64.AppImage MD-Preview-linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            MD-Preview-linux-x64.tar.gz
            MD-Preview-linux-x64.deb
            MD-Preview-linux-x86_64.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 == "## " version { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md | sed '/./,$!d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf 'See full changelog: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)" "$GITHUB_REF_NAME" \
              > RELEASE_NOTES.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MD-Preview-windows-x64.exe
            MD-Preview-linux-x64.tar.gz
            MD-Preview-linux-x64.deb
            MD-Preview-linux-x86_64.AppImage
          body_path: RELEASE_NOTES.md
